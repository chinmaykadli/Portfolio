name: Sync jobs command centre
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jobs-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch warden page
        run: curl -sL 'https://script.google.com/macros/s/AKfycbxvMb2mDx2Sl0syvkAyJ7I6JoxcyI_20cwDkS2yRkvInEbj3ea1S208vxsZZjM1BpA/exec' -o /tmp/warden.html
      - name: Extract user HTML
        run: node scripts/extract-jobs.js /tmp/warden.html /tmp/jobs-index.html
      - name: Commit if changed
        run: |
          mkdir -p jobs
          node - <<'NODE'
          const fs = require('fs');
          const target = 'jobs/index.html';
          const next = fs.readFileSync('/tmp/jobs-index.html', 'utf8');
          const previous = fs.existsSync(target) ? fs.readFileSync(target, 'utf8') : null;
          const normalize = html => html.replace(/(<div class="updated">)last refreshed:[^<]*(<\/div>)/g, '$1last refreshed:$2');
          if (previous === null || normalize(previous) !== normalize(next)) fs.writeFileSync(target, next);
          NODE
          if ! git diff --quiet -- jobs/index.html || ! git ls-files --error-unmatch jobs/index.html >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add jobs/index.html
            git commit -m 'jobs: sync command centre snapshot'
            git push
            echo 'updated'
          else
            echo 'no change'
          fi
